name: Save Docker Image to Release
on:
  workflow_dispatch:
    inputs:
      image:
        description: '想要 pull 的 image (例如 ghcr.io/open-webui/open-webui:0.11.0)'
        required: true
        default: 'ghcr.io/open-webui/open-webui:0.11.0'
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo docker image prune -a -f

      - name: Pull and Save Docker Image
        env:
          IMAGE: ${{ inputs.image }}
        run: |
          docker pull "$IMAGE"
          docker save "$IMAGE" | gzip > docker-image.tar.gz
          ls -lh docker-image.tar.gz

      # 每次覆蓋同一個 latest Release，避免佔用雲端空間
      - name: Delete Old Release if Exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes --cleanup-tag || true

      - name: Create Tag and Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Docker Image
          body: |
            Docker image: `${{ inputs.image }}`
            下載後載入方式：
            ```
            gunzip -c docker-image.tar.gz | docker load
            ```
          files: docker-image.tar.gz